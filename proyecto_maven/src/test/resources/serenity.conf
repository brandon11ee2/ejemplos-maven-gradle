serenity {
  encoding = "UTF-8"
  compress.filenames = true
  take.screenshots = FOR_EACH_ACTION
}

webdriver {
  driver = "edge"
  autodownload = true
  capabilities {
    "ms:edgeOptions" : {
      args = [
        "--start-maximized",
        "--no-sandbox",
        "--lang=es",
        "--disable-popup-blocking",
        "--disable-notifications",
        "--ignore-certificate-errors",
        "--allow-running-insecure-content",
        "--disable-translate",
        "--disable-extensions"
      ]
    }
  }
}
